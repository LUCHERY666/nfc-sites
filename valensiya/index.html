<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Отзывы Валенсия</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#fff8f5;
  --blush:#fde3e3;
  --red:#c4122f;
  --red-dark:#8f0c22;
  --leaf:#5b6b3f;
  --ink:#3a1a1f;
  --muted:#8c6b6f;
  --display:"Playfair Display",Georgia,serif;
  --body:"Onest","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);
  background-color:var(--paper);
  background-image:radial-gradient(110% 60% at 50% 0%,var(--blush) 0%,transparent 70%);
  background-attachment:fixed;
  padding-block:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;align-items:center;
}
main{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;min-width:0}
.tulips{width:min(230px,64vw);height:auto;display:block}
h1{margin:0;font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(2.4rem,11vw,3.1rem);line-height:1;color:var(--red-dark)}
.sub{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:-10px}
nav{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:6px}
a.btn{
  display:flex;align-items:center;justify-content:center;min-height:62px;padding:14px 20px;border-radius:999px;
  text-decoration:none;font-size:1.1rem;font-weight:600;letter-spacing:.01em;transition:transform .1s ease,box-shadow .15s ease;
}
a.red{color:#fff;background:linear-gradient(135deg,var(--red),var(--red-dark));box-shadow:0 8px 22px rgba(196,18,47,.35)}
a.line{color:var(--red-dark);background:#fff;border:1.8px solid var(--red);box-shadow:0 8px 22px rgba(196,18,47,.14)}
a.btn:hover{transform:translateY(-1px)}
a.btn:active{transform:scale(.98)}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
<main>
  <svg class="tulips" viewBox="0 0 230 190" role="img" aria-label="Тюльпаны">
    <defs>
      <path id="bloom" d="M0 0C-17-4-19-30-9-46L-3-31L0-48L3-31L9-46C19-30 17-4 0 0Z"/>
    </defs>
    <g stroke="#5b6b3f" stroke-width="3.2" stroke-linecap="round" fill="none">
      <path d="M115 176C115 140 114 112 115 82"/>
      <path d="M115 176C104 140 80 116 64 96"/>
      <path d="M115 176C128 140 152 116 168 96"/>
    </g>
    <g fill="#5b6b3f">
      <path d="M115 176C95 160 84 138 88 118C104 128 114 150 115 176Z"/>
      <path d="M115 176C135 160 146 138 142 118C126 128 116 150 115 176Z"/>
    </g>
    <g fill="#c4122f">
      <use href="#bloom" transform="translate(115 86) scale(1.5)"/>
      <use href="#bloom" transform="translate(63 100) rotate(-24) scale(1.35)" fill="#a50f27"/>
      <use href="#bloom" transform="translate(169 100) rotate(24) scale(1.35)" fill="#d8223e"/>
    </g>
  </svg>
  <h1>Валенсия</h1>
  <span class="sub">Студия флористики</span>
  <nav>
    <a class="btn red" href="https://yandex.ru/maps/org/valensiya/17405417321/reviews/">Яндекс Карты</a>
    <a class="btn line" href="https://2gis.ru/krasnoyarsk/firm/70000001038183263/tab/reviews">2ГИС</a>
  </nav>
</main>
</body>
</html>
