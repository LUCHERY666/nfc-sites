<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Отзывы Валенсия</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#fffaf6;
  --blush:#fbdcdc;
  --red:#c4122f;
  --red-dark:#8f0c22;
  --ink:#3a1a1f;
  --muted:#8c6b6f;
  --display:"Playfair Display",Georgia,serif;
  --body:"Onest","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);
  background-color:var(--paper);
  background-image:radial-gradient(90% 55% at 50% 22%,var(--blush) 0%,transparent 72%);
  background-attachment:fixed;
  padding-block:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;align-items:center;
}
main{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;min-width:0}
.bouquet{width:min(330px,88vw);height:auto;display:block;filter:drop-shadow(0 14px 18px rgba(120,10,30,.22))}
h1{margin:0;font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(2.5rem,12vw,3.2rem);line-height:1;color:var(--red-dark)}
.sub{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:-6px}
nav{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:8px}
a.btn{
  display:flex;align-items:center;justify-content:center;min-height:62px;padding:14px 20px;border-radius:999px;
  text-decoration:none;font-size:1.1rem;font-weight:600;letter-spacing:.01em;transition:transform .1s ease,box-shadow .15s ease;
}
a.red{color:#fff;background:linear-gradient(135deg,var(--red),var(--red-dark));box-shadow:0 8px 22px rgba(196,18,47,.35)}
a.line{color:var(--red-dark);background:#fff;border:1.8px solid var(--red);box-shadow:0 8px 22px rgba(196,18,47,.14)}
a.btn:hover{transform:translateY(-1px)}
a.btn:active{transform:scale(.98)}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
<main>
  <svg class="bouquet" viewBox="0 0 330 300" role="img" aria-label="Букет красных роз">
    <defs>
      <radialGradient id="pet" cx="50%" cy="100%" r="110%">
        <stop offset="0" stop-color="#7a0a1e"/>
        <stop offset=".45" stop-color="#b60f2c"/>
        <stop offset=".85" stop-color="#e2384f"/>
        <stop offset="1" stop-color="#f0657a"/>
      </radialGradient>
      <radialGradient id="pet2" cx="50%" cy="100%" r="110%">
        <stop offset="0" stop-color="#8e0c24"/>
        <stop offset=".5" stop-color="#c8183a"/>
        <stop offset="1" stop-color="#f27a8c"/>
      </radialGradient>
      <radialGradient id="pet3" cx="50%" cy="100%" r="110%">
        <stop offset="0" stop-color="#a50f2c"/>
        <stop offset=".6" stop-color="#d8283f"/>
        <stop offset="1" stop-color="#ff9aa8"/>
      </radialGradient>
      <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#2f4a22"/>
        <stop offset="1" stop-color="#6f9a45"/>
      </linearGradient>
      <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e4405a"/>
        <stop offset="1" stop-color="#8f0c22"/>
      </linearGradient>
      <path id="p1" d="M0 0C-34-8-52-42-26-62C-8-74 8-74 26-62C52-42 34-8 0 0Z"/>
      <path id="p2" d="M0 0C-30-6-44-36-22-54C-6-64 6-64 22-54C44-36 30-6 0 0Z"/>
      <path id="lf" d="M0 0C-16-18-18-46 0-76C18-46 16-18 0 0Z"/>
      <g id="rose">
        <g fill="url(#pet)" stroke="#6b0919" stroke-opacity=".45" stroke-width="1">
          <use href="#p1" transform="rotate(0)"/>
          <use href="#p1" transform="rotate(72)"/>
          <use href="#p1" transform="rotate(144)"/>
          <use href="#p1" transform="rotate(216)"/>
          <use href="#p1" transform="rotate(288)"/>
        </g>
        <g fill="url(#pet2)" stroke="#6b0919" stroke-opacity=".5" stroke-width="1" transform="scale(.74) rotate(36)">
          <use href="#p2" transform="rotate(0)"/>
          <use href="#p2" transform="rotate(72)"/>
          <use href="#p2" transform="rotate(144)"/>
          <use href="#p2" transform="rotate(216)"/>
          <use href="#p2" transform="rotate(288)"/>
        </g>
        <g fill="url(#pet3)" stroke="#6b0919" stroke-opacity=".5" stroke-width="1" transform="scale(.46) rotate(10)">
          <use href="#p2" transform="rotate(0)"/>
          <use href="#p2" transform="rotate(90)"/>
          <use href="#p2" transform="rotate(180)"/>
          <use href="#p2" transform="rotate(270)"/>
        </g>
        <g fill="none" stroke="#5e0716" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round">
          <path d="M-7 -2C-7 -12 7 -12 7 -2C7 7 -3 8 -4 1"/>
        </g>
        <g fill="#fff" fill-opacity=".14">
          <path d="M-30-46C-18-60 8-62 22-52C4-54-14-50-30-46Z"/>
        </g>
      </g>
    </defs>
    <g stroke="#34501f" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M165 262C165 220 166 190 165 150"/>
      <path d="M165 262C150 220 112 196 92 164"/>
      <path d="M165 262C180 220 218 196 238 164"/>
    </g>
    <g fill="url(#leaf)" stroke="#2a4219" stroke-width="1" stroke-opacity=".6">
      <use href="#lf" transform="translate(150 210) rotate(-62) scale(.9)"/>
      <use href="#lf" transform="translate(182 214) rotate(60) scale(.9)"/>
      <use href="#lf" transform="translate(100 146) rotate(-78) scale(.85)"/>
      <use href="#lf" transform="translate(230 146) rotate(78) scale(.85)"/>
      <use href="#lf" transform="translate(165 120) rotate(-30) scale(.8)"/>
      <use href="#lf" transform="translate(165 120) rotate(34) scale(.8)"/>
    </g>
    <g stroke="#1f3314" stroke-opacity=".5" stroke-width="1" fill="none">
      <path d="M150 210L109 184M182 214L224 188M100 146L40 128M230 146L290 128"/>
    </g>
    <use href="#rose" transform="translate(92 138) scale(.78) rotate(-14)"/>
    <use href="#rose" transform="translate(238 138) scale(.78) rotate(18)"/>
    <use href="#rose" transform="translate(165 98) scale(.98) rotate(4)"/>
    <g>
      <path d="M165 250C142 236 118 244 112 262C130 270 152 268 165 256Z" fill="url(#ribbon)"/>
      <path d="M165 250C188 236 212 244 218 262C200 270 178 268 165 256Z" fill="url(#ribbon)"/>
      <path d="M165 254L142 292M165 254L188 292" stroke="#8f0c22" stroke-width="9" stroke-linecap="round"/>
      <rect x="153" y="246" width="24" height="18" rx="7" fill="#c4122f"/>
    </g>
  </svg>
  <h1>Валенсия</h1>
  <span class="sub">Студия флористики</span>
  <nav>
    <a class="btn red" href="https://yandex.ru/maps/org/valensiya/17405417321/reviews/">Яндекс Карты</a>
    <a class="btn line" href="https://2gis.ru/krasnoyarsk/firm/70000001038183263/tab/reviews">2ГИС</a>
  </nav>
</main>
</body>
</html>
