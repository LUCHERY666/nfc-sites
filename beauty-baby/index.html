<title>Отзывы Beauty Baby</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* одна светлая тема: белый, пудрово-розовый, золото; логотип сверху, две кнопки */
:root{
  --white:#ffffff;
  --blush:#fbeeee;
  --rose:#e9b9bf;
  --gold:#b58a4f;
  --gold-light:#e6c88f;
  --ink:#4a3a3c;
  --muted:#8a7476;
  --display:"Cormorant Garamond",Georgia,serif;
  --body:"Onest","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--body);
  background:var(--white);
  background-image:radial-gradient(120% 70% at 50% 0%,var(--blush) 0%,var(--white) 70%);
  background-attachment:fixed;
  padding-block:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;align-items:center;min-height:100vh;
}
main{width:100%;max-width:400px;min-height:calc(100vh - 56px);display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;gap:20px;min-width:0}
.logo{width:min(280px,76vw);height:auto;display:block;mix-blend-mode:multiply;align-self:end}
nav{width:100%;display:flex;flex-direction:column;gap:12px}
a.btn{
  display:flex;align-items:center;justify-content:center;min-height:62px;padding:14px 20px;
  border-radius:999px;text-decoration:none;font-size:1.1rem;font-weight:600;letter-spacing:.01em;
  transition:transform .1s ease,box-shadow .15s ease;
}
a.gold{color:#fff;background:linear-gradient(135deg,#c9a062,#a97d44);box-shadow:0 8px 20px rgba(181,138,79,.35)}
a.rose{color:var(--ink);background:var(--white);border:1.5px solid var(--gold);box-shadow:0 8px 20px rgba(233,185,191,.4)}
a.btn:hover{transform:translateY(-1px)}
a.btn:active{transform:scale(.98)}
a.btn:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
